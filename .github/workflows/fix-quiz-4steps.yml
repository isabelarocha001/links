name: fix-quiz-4steps

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_quiz_4steps.py
      - .github/workflows/fix-quiz-4steps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-quiz-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore + apply 4-step commercial quiz
        run: python3 scripts/fix_quiz_4steps.py
      - name: Commit patched app.vue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.vue
          git diff --cached --quiet && echo "no app.vue change" && exit 0
          git commit -m "fix(quiz): fluxo 4 etapas interesse→ticket→momento→intenção (só qualificado no WA)"
          git push
