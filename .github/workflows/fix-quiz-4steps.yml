name: fix-quiz-4steps

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_quiz_4steps.py
      - scripts/fix_quiz_remove_age.py
      - scripts/fix_quiz_skip_welcome.py
      - scripts/fix_quiz_v_if_quotes.py
      - .github/workflows/fix-quiz-4steps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-quiz-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply quiz patches
        run: |
          python3 scripts/fix_quiz_v_if_quotes.py || true
          python3 scripts/fix_quiz_skip_welcome.py || true
      - name: Commit patched app.vue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.vue
          git diff --cached --quiet && echo "no app.vue change" && exit 0
          git commit -m "fix(quiz): corrige v-if quotes no título (build Vercel)"
          git push
