name: restore-and-fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-and-fix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and apply VIP + WhatsApp fixes
        run: |
          set -e
          git checkout 6dfd289e469aeca52255886e737de11d465c5c42 -- app.vue assets/css/links-page.css
          python3 << 'PY'
          from pathlib import Path
          p = Path('app.vue')
          text = p.read_text()
          text = text.replace(
          '              <span class="vip-icon">⭐</span>',
          '''              <span class="vip-icon vip-icon-stack" aria-hidden="true">
                <span class="vip-robot">🤖</span>
                <img class="vip-tg-logo" :src="logoTgPurple" alt="" width="26" height="26" />
              </span>''', 1)
          text = text.replace(
          "const whatsappUrl = 'https://wa.me/5547992750967'",
          "const whatsappUrl = 'https://wa.me/5547992750967?text=' + encodeURIComponent('Quero mais informaçoes sobre o seu conteudo vip')", 1)
          text = text.replace(
          "const logoTg = LOGO_TG_BLUE",
          "const logoTg = LOGO_TG_BLUE\nconst logoTgPurple = LOGO_TG_PURPLE", 1)
          p.write_text(text)
          p = Path('assets/css/links-page.css')
          text = p.read_text()
          old = '.vip-icon { font-size: 1.4rem; }'
          new = '''.vip-icon { font-size: 1.4rem; }
.vip-icon-stack {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}
.vip-robot {
  position: absolute;
  font-size: 1.55rem;
  line-height: 1;
  opacity: 0.55;
  transform: translate(-4px, 2px) scale(1.05);
  filter: grayscale(0.15);
  z-index: 0;
  animation: vip-robot-pulse 2.8s ease-in-out infinite;
}
.vip-tg-logo {
  position: relative;
  z-index: 1;
  width: 26px;
  height: 26px;
  object-fit: contain;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(42, 171, 238, 0.35), 0 2px 10px rgba(42, 171, 238, 0.25);
  animation: vip-tg-float 2.4s ease-in-out infinite;
}
@keyframes vip-tg-float {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-2px) scale(1.06); }
}
@keyframes vip-robot-pulse {
  0%, 100% { opacity: 0.45; transform: translate(-4px, 2px) scale(1.02); }
  50% { opacity: 0.7; transform: translate(-5px, 1px) scale(1.08); }
}'''
          if old not in text:
              raise SystemExit('css marker missing')
          p.write_text(text.replace(old, new, 1))
          print('patched ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.vue assets/css/links-page.css
          git status
          git diff --cached --stat
          git commit -m "fix: VIP Telegram+robo animado e WhatsApp mensagem pre-preenchida" || echo "no changes"
          git push
