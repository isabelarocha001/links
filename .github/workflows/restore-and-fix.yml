name: restore-and-fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-and-fix.yml'
      - 'scripts/**'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UI polish
        run: python3 scripts/fix_ui_polish.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.vue assets/css/links-page.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: UI - robo segurando Telegram, sem Modelo de Luxo, bio sem fundo preto"
            git push
          fi
