name: Restore links-page.css
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-css.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download good CSS
        run: |
          curl -fsSL "https://raw.githubusercontent.com/isabelarocha001/links/8b59f0f/assets/css/links-page.css" -o assets/css/links-page.css
          python3 - <<'PY'
          p = 'assets/css/links-page.css'
          css = open(p).read()
          print('downloaded', len(css))
          assert len(css) > 20000, 'CSS too small'
          old = '.wa-status-typing { color: #25d366; font-style: italic; }'
          new = '''.wa-status-typing { color: #ffffff; font-style: italic; }
.wa-funnel-header .wa-status-typing,
.wa-header .wa-status-typing { color: #fff !important; }'''
          if old in css:
              css = css.replace(old, new, 1)
              open(p,'w').write(css)
              print('applied typing fix')
          print('final', len(css))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/css/links-page.css
          if git diff --staged --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: restaurar CSS completo da pagina de links (truncado)'
          git push
